<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="Content-Language" content="vi">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vạn Bảo Các - Thương Mại Điện Tử Tu Tiên</title>
  <link rel="icon" type="image/png" href="/images/logo.png">

  <!-- Google Fonts đã Việt hóa 100%: Playfair Display, Lora, Be Vietnam Pro (Hỗ trợ đầy đủ bảng mã tiếng Việt UTF-8) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,600&display=swap&subset=vietnamese" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['Playfair Display', 'Lora', 'Be Vietnam Pro', 'Georgia', 'serif'],
            sans: ['Be Vietnam Pro', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          },
          colors: {
            jade: '#10b981',
            gold: '#f59e0b',
            void: '#06090e'
          }
        }
      }
    }
  </script>

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#06090e] text-slate-200 min-h-screen flex flex-col relative selection:bg-emerald-500 selection:text-black antialiased">

  <!-- Background Celestial Canvas -->
  <canvas id="celestial-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-40"></canvas>

  <!-- Ambient Mystical Fog Overlays -->
  <div class="fixed inset-0 pointer-events-none z-0 mystic-bg"></div>

  <!-- Navbar Container (Sticky Header) -->
  <div id="navbar-container" class="relative z-30"></div>

  <!-- Main Content Area -->
  <main id="main-content" class="relative z-10 flex-1"></main>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col space-y-2 pointer-events-none max-w-sm w-full"></div>

  <!-- Footer -->
  <footer class="relative z-10 border-t border-slate-900 bg-slate-950/80 backdrop-blur-md py-8 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 space-y-3">
      <div class="flex items-center justify-center space-x-2">
        <span class="w-7 h-7 rounded-full overflow-hidden border border-emerald-400/30 shrink-0 inline-flex">
          <img src="/images/logo.png" alt="Vạn Bảo Các" class="w-full h-full object-cover scale-[1.2]">
        </span>
        <span class="font-cinzel font-bold text-slate-300 tracking-wider">VẠN BẢO CÁC</span>
        <span class="text-slate-600">•</span>
        <span class="text-slate-400">Thiên Địa Giao Dịch Phường</span>
      </div>
      <p class="text-[11px] text-slate-500 max-w-md mx-auto">
        Hệ thống thương mại điện tử tu tiên nội bộ. Tiền tệ lưu thông: Linh Thạch. Mọi giao dịch được hộ trì bởi Thiên Đạo Khế Ước.
      </p>
      <div class="text-[10px] text-slate-600 font-mono">
        Admin & 4 Sellers & Buyers • Node.js + Express + MongoDB Atlas + Tailwind CSS
      </div>
    </div>
  </footer>

  <!-- Application Scripts -->
  <script src="/js/state.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/components/navbar.js"></script>
  <script src="/js/components/userModal.js"></script>
  <script src="/js/components/rechargeModal.js"></script>
  <script src="/js/views/authView.js"></script>
  <script src="/js/views/homeView.js"></script>
  <script src="/js/views/categoryView.js"></script>
  <script src="/js/views/productDetailView.js"></script>
  <script src="/js/views/cartView.js"></script>
  <script src="/js/views/wishlistView.js"></script>
  <script src="/js/views/adminView.js"></script>
  <script src="/js/views/sellerView.js"></script>
  <script src="/js/views/ordersView.js"></script>
  <script src="/js/views/inventoryView.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
